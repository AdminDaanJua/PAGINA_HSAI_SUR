                colorHeader: "from-red-600 to-amber-600",
                icono: "heart-crack",
                lider: "Coordinador del Servicio de Urgencias",
                participantes: ["Médicos y Enfermería de Urgencias", "Laboratorio", "Radiólogo", "Técnico Imagen", "Camillero"],
                antes: ["Verificación diaria de medicamentos e insumos de código cardiovascular."],
                durante: ["Ingreso inmediato a área de choque.", "Electrocardiograma en <10 min y niveles de Troponina I.", "Tratamiento óptimo y registro de Síndrome Coronario Agudo.", "Gestión de traslado si aplica."],
                despues: ["Reporte de seguimiento y análisis de oportunidad clínica."]
            },
            {
                id: "uno",
                nombre: "Código Uno",
                subtitulo: "Persona Custodiada",
                categoria: "seguridad",
                colorBadge: "bg-indigo-100 text-indigo-800 border-indigo-300",
                colorHeader: "from-indigo-600 to-blue-800",
                icono: "lock",
                lider: "Dirección de Infraestructura y Servicios",
                participantes: ["Médico de Hospitalización", "Vigilancia", "Enfermería"],
                antes: ["Personal de seguridad equipado con radiocomunicación."],
                durante: ["Atención médica sin discriminación.", "Asignación de personal clínico exclusivo.", "EL PERSONAL CLÍNICO NUNCA INGRESA SOLO (Siempre acompañado de un custodio)."],
                despues: ["Acompañamiento permanente hasta la retirada del paciente.", "Resguardo de la privacidad en todo momento."]
            },
            {
                id: "coe",
                nombre: "Código COE",
                subtitulo: "Activación del Centro de Operaciones de Emergencias",
                categoria: "evacuacion",
                colorBadge: "bg-cyan-100 text-cyan-800 border-cyan-300",
                colorHeader: "from-cyan-700 to-blue-900",
                icono: "building-2",
                lider: "Director General / Director de Operaciones",
                participantes: ["Directores", "Coordinadores (Enfermería, Admisión, Capital Humano, Calidad, Seguridad, R.P.)", "Contralor"],
                antes: ["Directorios telefónicos de emergencia y equipos de comunicación listos."],
                durante: ["Reunión inmediata del comité en Dirección General.", "Activación del Plan de Preparativos y Mando Único.", "Canal de comunicación directo con el sitio de crisis."],
                despues: ["Valoración integral y desactivación oficial del Plan de Preparativos."]
            },
            {
                id: "ictus",
                nombre: "Código Ictus / Stroke",
                subtitulo: "Rescate Neurovascular (Evento Cerebrovascular)",
                categoria: "medico",
                colorBadge: "bg-sky-100 text-sky-800 border-sky-300",
                colorHeader: "from-sky-600 to-indigo-800",
                icono: "brain",
                lider: "Coordinador de Urgencias / Urgenciólogo de turno",
                participantes: ["Urgencias", "Imagenología", "Camilleros", "Enfermería"],
                antes: ["Capacitación en detección de signos de ECV e insumos listos."],
                durante: ["Aplicar Escala Cincinnati (Enfermería) y Escala NIHSS (Médico).", "Notificar a grupo Hospitalario Stroke.", "Solicitud prioritaria de AngioTAC de cráneo.", "Tratamiento según Guías Internacionales (AHA/ASA 2018)."],
                despues: ["Reporte de seguimiento Ictus, análisis del caso y plan de mejora."]
            },
            {
                id: "100",
                nombre: "Código 100",
                subtitulo: "Intento o Ideación Suicida",
                categoria: "medico",
                colorBadge: "bg-violet-100 text-violet-800 border-violet-300",
                colorHeader: "from-violet-600 to-purple-800",
                icono: "life-buoy",
                lider: "Médico de Urgencias",
                participantes: ["Relaciones Públicas", "Psicólogo", "Médicos de Urgencias y Hospitalización"],
                antes: ["Aplicación de valoración SAD Person al ingreso y escala ASQ."],
                durante: ["Activación ante riesgo moderado-alto.", "Contención psicológica inmediata por Psicología y Relaciones Públicas.", "Custodia y resguardo de la seguridad del paciente.", "Gestión de traslado si se requiere."],
                despues: ["Reporte de seguimiento y análisis de áreas de oportunidad."]
            },
            {
                id: "7",
                nombre: "Código 7",
                subtitulo: "Accidente Grave de Personal",
                categoria: "medico",
                colorBadge: "bg-rose-100 text-rose-800 border-rose-300",
                colorHeader: "from-rose-600 to-red-700",
                icono: "user-cog",
                lider: "Médico de Urgencias",
                participantes: ["Médico de Guardia / Urgencias", "Enfermería", "Camillero"],
                antes: ["Procedimientos de orden, limpieza y seguridad laboral vigentes."],
                durante: ["Acudir de inmediato al punto del accidente.", "Valoración integral y traslado seguro del colaborador a Urgencias."],
                despues: ["Reporte oficial de accidente laboral en Intramed.", "Análisis de causalidad y medidas preventivas."]
            }
        ];

        let selectedCodeId = "oro";
        let activeFilter = "all";
        let searchQuery = "";

        // Inicializador
        document.addEventListener('DOMContentLoaded', () => {
            renderCodeList();
            renderCodeDetail(selectedCodeId);
            setupEventListeners();
            lucide.createIcons();
        });

        // Configurar Event Listeners
        function setupEventListeners() {
            // Buscador
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderCodeList();
            });

            // Filtros
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('bg-blue-900', 'text-white');
                        b.classList.add('bg-slate-100', 'text-slate-600');
                    });
                    e.target.classList.remove('bg-slate-100', 'text-slate-600');
                    e.target.classList.add('bg-blue-900', 'text-white');

                    activeFilter = e.target.getAttribute('data-filter');
                    renderCodeList();
                });
            });
        }

        // Renderizar Lista Lateral
        function renderCodeList() {
            const listContainer = document.getElementById('codeList');
            listContainer.innerHTML = '';

            const filteredCodes = codigosData.filter(item => {
                const matchesFilter = activeFilter === 'all' || item.categoria === activeFilter;
                const matchesSearch = item.nombre.toLowerCase().includes(searchQuery) || 
                                      item.subtitulo.toLowerCase().includes(searchQuery) ||
                                      item.lider.toLowerCase().includes(searchQuery) ||
                                      item.participantes.some(p => p.toLowerCase().includes(searchQuery));
                return matchesFilter && matchesSearch;
            });

            if(filteredCodes.length === 0) {
                listContainer.innerHTML = `
                    <div class="p-6 text-center text-slate-400 text-sm">
                        No se encontraron códigos con los criterios aplicados.
                    </div>
                `;
                return;
            }

            filteredCodes.forEach(item => {
                const isSelected = item.id === selectedCodeId;
                const card = document.createElement('div');
                card.className = `p-3.5 rounded-lg cursor-pointer transition-all duration-150 mb-1 flex items-center justify-between ${
                    isSelected 
                        ? 'bg-blue-50 border-l-4 border-blue-700 shadow-sm' 
                        : 'hover:bg-slate-50 border-l-4 border-transparent'
                }`;

                card.onclick = () => {
                    selectedCodeId = item.id;
                    renderCodeList();
                    renderCodeDetail(item.id);
                    
                    // En móvil, hacer scroll suave hacia el detalle
                    if (window.innerWidth < 1024) {
                        document.getElementById('codeDetailContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                };

                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="p-2 rounded-lg bg-slate-100 text-slate-700">
                            <i data-lucide="${item.icono}" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <div class="font-bold text-sm text-slate-800">${item.nombre}</div>
                            <div class="text-xs text-slate-500 line-clamp-1">${item.subtitulo}</div>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                `;
                listContainer.appendChild(card);
            });
            lucide.createIcons();
        }

        // Renderizar Detalle de Código
        function renderCodeDetail(codeId) {
            const container = document.getElementById('codeDetailContainer');
            const data = codigosData.find(c => c.id === codeId);

            if(!data) return;

            container.innerHTML = `
                <!-- Encabezado del Detalle -->
                <div class="bg-gradient-to-r ${data.colorHeader} text-white p-6 rounded-xl shadow-md mb-6 relative overflow-hidden">
                    <div class="absolute right-4 bottom-2 opacity-10">
                        <i data-lucide="${data.icono}" class="w-36 h-36"></i>
                    </div>
                    <div class="relative z-10">
                        <span class="inline-block text-xs font-semibold px-2.5 py-1 rounded-md bg-white/20 backdrop-blur-md text-white mb-2 uppercase tracking-wider">
                            ${data.categoria}
                        </span>
                        <h2 class="text-2xl sm:text-3xl font-black">${data.nombre}</h2>
                        <p class="text-sm sm:text-base text-white/90 font-medium mt-1">${data.subtitulo}</p>
                    </div>
                </div>

                <!-- Tarjeta del Líder de Respuesta -->
                <div class="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-6 flex items-start space-x-3">
                    <div class="bg-blue-100 p-2 rounded-lg text-blue-800 mt-0.5">
                        <i data-lucide="user-check" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Líder del Protocolo</span>
                        <h4 class="font-bold text-slate-800 text-base">${data.lider}</h4>
                    </div>
                </div>

                <!-- Grid de Fases: ANTES, DURANTE, DESPUÉS -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    
                    <!-- FASE ANTES -->
                    <div class="bg-white border border-slate-200 rounded-lg p-4 shadow-sm">
                        <div class="flex items-center space-x-2 text-blue-600 font-bold text-sm mb-3 pb-2 border-b border-slate-100">
                            <i data-lucide="clock" class="w-4 h-4"></i>
                            <span>ANTES (Prevención)</span>
                        </div>
                        <ul class="space-y-2 text-xs text-slate-600">
                            ${data.antes.map(item => `<li class="flex items-start"><span class="text-blue-500 mr-1.5">•</span><span>${item}</span></li>`).join('')}
                        </ul>
                    </div>

                    <!-- FASE DURANTE -->
                    <div class="bg-white border border-amber-200 rounded-lg p-4 shadow-sm bg-amber-50/20">
                        <div class="flex items-center space-x-2 text-amber-600 font-bold text-sm mb-3 pb-2 border-b border-amber-100">
                            <i data-lucide="zap" class="w-4 h-4"></i>
                            <span>DURANTE (Acción)</span>
                        </div>
                        <ul class="space-y-2 text-xs text-slate-700 font-medium">
                            ${data.durante.map(item => `<li class="flex items-start"><span class="text-amber-500 mr-1.5">•</span><span>${item}</span></li>`).join('')}
                        </ul>
                    </div>

                    <!-- FASE DESPUÉS -->
                    <div class="bg-white border border-slate-200 rounded-lg p-4 shadow-sm">
                        <div class="flex items-center space-x-2 text-emerald-600 font-bold text-sm mb-3 pb-2 border-b border-slate-100">
                            <i data-lucide="check-circle" class="w-4 h-4"></i>
                            <span>DESPUÉS (Seguimiento)</span>
                        </div>
                        <ul class="space-y-2 text-xs text-slate-600">
                            ${data.despues.map(item => `<li class="flex items-start"><span class="text-emerald-500 mr-1.5">•</span><span>${item}</span></li>`).join('')}
                        </ul>
                    </div>

                </div>

                <!-- Equipo Participante -->
                <div class="bg-white border border-slate-200 rounded-lg p-4">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                        <i data-lucide="users" class="w-4 h-4 text-slate-500"></i> Integrantes y Equipo Multidisciplinario
                    </h4>
                    <div class="flex flex-wrap gap-1.5">
                        ${data.participantes.map(p => `<span class="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded-md font-medium">${p}</span>`).join('')}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }
    </script>
</body>
</html>
